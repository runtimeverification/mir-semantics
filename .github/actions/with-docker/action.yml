name: 'With Docker'
description: 'Run a given stage with Docker Image'
inputs:
  container-name:
    description: 'Docker container name to use'
    required: true
runs:
  using: 'composite'
  steps:
  - name: 'Set up Docker'
    shell: bash {0}
    env:
      CONTAINER_NAME: ${{ inputs.container-name }}
    run: |
      set -euxo pipefail

      TAG=runtimeverificationinc/${CONTAINER_NAME}
      K_COMMIT=$(grep -Po '[0-9.]+' ./deps/k_release)
      UV_VERSION=$(cat deps/uv_release)
      RUST_TOOLCHAIN=$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml)
      test -n "${RUST_TOOLCHAIN}"

      # Not USER: that variable is exported, and rootless Podman looks up the runner
      # user's subordinate UIDs by $USER. Overriding it leaves the container with
      # only root mapped.
      CONTAINER_USER=github-user
      CONTAINER_GROUP=${CONTAINER_USER}
      CONTAINER_UID=1000
      CONTAINER_GID=${CONTAINER_UID}
      WORKSPACE=/home/${CONTAINER_USER}/workspace

      docker build . --tag "${TAG}"                    \
        --file .github/workflows/Dockerfile            \
        --build-arg K_COMMIT="${K_COMMIT}"             \
        --build-arg USER="${CONTAINER_USER}"           \
        --build-arg GROUP="${CONTAINER_GROUP}"         \
        --build-arg USER_ID="${CONTAINER_UID}"         \
        --build-arg GROUP_ID="${CONTAINER_GID}"        \
        --build-arg RUST_TOOLCHAIN="${RUST_TOOLCHAIN}" \
        --build-arg UV_VERSION="${UV_VERSION}"

      # A container left over from a canceled run of the same commit would make 'docker run' fail.
      docker rm -f "${CONTAINER_NAME}" || true

      docker run                   \
        --name "${CONTAINER_NAME}" \
        --rm                       \
        --interactive              \
        --tty                      \
        --detach                   \
        --workdir "${WORKSPACE}"   \
        "${TAG}"

      # Copy the sources in instead of bind-mounting them: on rootless Podman runners the
      # container user cannot write to a bind-mounted host directory. './.' copies the
      # directory's contents; a bare '.' lands in a subdirectory with some Podman versions.
      docker cp ./. "${CONTAINER_NAME}:${WORKSPACE}"
      docker exec --user root "${CONTAINER_NAME}" chown -R "${CONTAINER_USER}:${CONTAINER_GROUP}" "${WORKSPACE}"
