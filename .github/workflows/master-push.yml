name: 'Master Push'
on:
  # run on master pushes to manage the version in the release branch
  push:
    branches:
      - master
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # push updates and a version bump to the release branch
  version-bump:
    name: 'Version Bump and Start Release'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JENKINS_GITHUB_PAT }}
          fetch-depth: 0
      - name: 'Configure GitHub user'
        run: |
          git config user.name devops
          git config user.email devops@runtimeverification.com
      - name: 'Get uv release'
        id: uv_release
        run: |
          echo uv_version=$(cat deps/uv_release) >> "${GITHUB_OUTPUT}"
      - name: 'Install uv'
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.uv_release.outputs.uv_version }}
      - name: 'Update release branch with current master'
        run: |
          git checkout -B release origin/release
          # The release branch owns the version counter. master carries sentinel
          # 0.0.0 and should not be changed by any scripts. Release branch reads
          # the prior version (from release) and bumps it. `--strategy-option=ours`
          # keeps the release branch's version files when they conflict with master.
          # See docs/dev/releasing.md
          prior_version=$(cat package/version)

          # Choose the bump level from `Bump:` trailers on the new master commits
          # (defaults to patch; major wins over minor wins over patch).
          new_commits="origin/release..origin/master"
          if git log --format='%B' "${new_commits}" | grep -qiE '^[[:space:]]*Bump:[[:space:]]*major[[:space:]]*$'; then
              bump_level=major
          elif git log --format='%B' "${new_commits}" | grep -qiE '^[[:space:]]*Bump:[[:space:]]*minor[[:space:]]*$'; then
              bump_level=minor
          fi
          echo "Release bump level: ${bump_level}"

          git merge --no-edit --strategy-option=ours origin/master
          package/version.sh bump ${prior_version} ${bump_level}
          # substitute the version in all relevant files
          package/version.sh sub
          uv --directory kmir lock --no-upgrade

          # add changes to staging and commit (if there are any)
          if git add --update && git commit --no-edit --allow-empty --message "Set Version: $(cat package/version)"; then
            # Push the changes to the release branch -- Trigger the Release Process and Testing
            git push origin release
            # tag master with a release tag
            git tag "release-$(cat package/version)" origin/master
            git push origin "release-$(cat package/version)"
          fi
