name: 'Test'
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here writes to the repository, so the token stays read-only regardless of
# the repository default.
permissions:
  contents: read

jobs:
  code-quality-checks:
    name: 'Code Quality Checks'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Get uv release'
        id: uv_release
        run: |
          echo "uv_version=$(cat deps/uv_release)" >> "${GITHUB_OUTPUT}"
      - name: 'Install uv'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ steps.uv_release.outputs.uv_version }}
      - name: 'Install Nix'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - name: 'Run code quality checks'
        run: make check

  unit-tests:
    needs: code-quality-checks
    name: 'Unit Tests'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Get uv release'
        id: uv_release
        run: |
          echo "uv_version=$(cat deps/uv_release)" >> "${GITHUB_OUTPUT}"
      - name: 'Install uv'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ steps.uv_release.outputs.uv_version }}
      - name: 'Run unit tests'
        run: make test-unit PARALLEL=12

  integration-tests:
    needs: code-quality-checks
    name: 'Integration Tests ${{ matrix.name }}'
    runs-on: [self-hosted, linux, normal]
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: 'LLVM Concrete Tests'
            test-args: '-k "llvm or test_run_smir_random"'
            parallel: 12
            timeout: 60
          - name: 'Haskell Exec SMIR'
            test-args: '-k "test_exec_smir and haskell"'
            parallel: 6
            timeout: 60
          - name: 'Haskell Termination'
            test-args: '-k test_prove_termination'
            parallel: 6
            timeout: 60
          - name: 'Haskell Proofs'
            test-args: '-k "test_prove and not test_prove_termination"'
            parallel: 6
            timeout: 150
          - name: 'Verify Rust Std'
            test-args: '-k test_verify_rust_std'
            parallel: 6
            timeout: 60
          - name: 'Remainder'
            test-args: '-k "not llvm and not test_run_smir_random and not test_exec_smir and not test_prove_termination and not test_prove and not test_verify_rust_std"'
            parallel: 6
            timeout: 60
    env:
      # One container per matrix entry: several entries can land on the same runner.
      CONTAINER: mir-semantics-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: 'Set up Docker'
        uses: ./.github/actions/with-docker
        with:
          container-name: ${{ env.CONTAINER }}
      - name: 'Build stable-mir-json and kmir'
        run: docker exec --user github-user "${CONTAINER}" make build
      - name: 'Run integration tests'
        env:
          TEST_ARGS: ${{ matrix.test-args }}
          PARALLEL: ${{ matrix.parallel }}
        run: |
          docker exec --user github-user "${CONTAINER}" make test-integration \
            TEST_ARGS="${TEST_ARGS}" PARALLEL="${PARALLEL}"
      - name: 'Tear down Docker'
        if: always()
        run: |
          # Best effort: the container does not exist if 'Set up Docker' failed, and a
          # non-zero exit here would mask the step that actually failed.
          docker rm -f "${CONTAINER}" || true

  stable-mir-json-integration-tests:
    needs: code-quality-checks
    name: "Integration with stable-mir-json"
    runs-on: [self-hosted, linux, normal]
    env:
      CONTAINER: mir-semantics-${{ github.job }}-${{ github.sha }}
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: 'Set up Docker'
        uses: ./.github/actions/with-docker
        with:
          container-name: ${{ env.CONTAINER }}
      - name: 'Build stable-mir-json'
        run: docker exec --user github-user "${CONTAINER}" make stable-mir-json
      - name: 'Build kmir (within docker)'
        run: docker exec --user github-user "${CONTAINER}" make build
      - name: 'Run parser tests (within docker)'
        run: docker exec --user github-user "${CONTAINER}" make smir-parse-tests
      - name: 'Tear down Docker'
        if: always()
        run: |
          # Best effort, see the integration-tests job.
          docker rm -f "${CONTAINER}" || true

  test-kmir-image:
    name: Test Kmir Image
    needs: [ unit-tests, code-quality-checks ]
    runs-on: ubuntu-latest
    env:
      CONTAINER: "kmir-${{ github.run_id }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set Image Name Parameters
        id: set-image-name
        run: |
          echo "k-version=$(cat deps/k_release)" >> "$GITHUB_OUTPUT"
          echo "image=kmir:ubuntu-jammy-$(cat package/version)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Kmir Container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.kmir
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            K_VERSION=${{ steps.set-image-name.outputs.k-version }}
          tags: ${{ steps.set-image-name.outputs.image }}

      - name: Container Sanity Check
        env:
          IMAGE: ${{ steps.set-image-name.outputs.image }}
        run: |
          # Create output directories for each test
          for k_file in kmir/src/tests/integration/data/*/*-spec.k; do
            proof_dir="$(dirname "${k_file}")/proofs"
            mkdir -p "${proof_dir}"
            chmod 777 "${proof_dir}"
          done

          # Start Container
          docker run --detach --rm -t \
            --name "${CONTAINER}" \
            -v "$PWD:/home/kmir/workspace" \
            -w /home/kmir/workspace \
            "${IMAGE}" \
            /bin/bash

          # Run all tests in a single exec command to maintain fixuid context
          docker exec \
            -w /home/kmir/workspace \
            "${CONTAINER}" \
            /bin/bash -c '
              for k_file in kmir/src/tests/integration/data/*/*-spec.k; do
                echo "Running ${k_file}"
                proof_dir="$(dirname ${k_file})/proofs"
                if ! kmir prove run "${k_file}" --proof-dir "${proof_dir}" 2>&1; then
                  echo "Proof failed for ${k_file}"
                fi
              done
            '

          # Print test results
          echo "Test results:"
          find kmir/src/tests/integration/data -name "proofs" -type d >> "$GITHUB_STEP_SUMMARY"

      - name: Tear Down Container
        if: always()
        run: docker rm -f "${CONTAINER}" || true


  nix:
    needs: code-quality-checks
    name: 'Nix Tests'
    strategy:
      fail-fast: false
      matrix:
        runner: [normal, MacM1]  # Both are self-hosted.
    # Both runners have Nix installed. Neither Nix nor cachix-action is installed here:
    # cachix-action would pick up a revoked token stored on the runners.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Check out pull request HEAD instead of merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false

      - name: 'Build and test'
        run: |
          set -euxo pipefail
          nix --version
          nix flake check # build and run smoke test
