name: RV Run Proofs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which crate to verify
        required: true
        type: choice
        options:
          - p-token
          - program
        default: p-token
      proofs:
        description: Start symbols for proofs to run
        required: true
        type: string
        default: "['test_ptoken_domain_data', 'test_process_approve', 'test_process_get_account_data_size', 'test_process_initialize_immutable_owner']"
      kmir:
        description: KMIR to work with (must exist as a docker image tag, optional)
        required: false
        type: string
        default: # empty = retrieve from submodule (later)
      smir:
        description: Stable MIR JSON to work with (commit hash, optional)
        required: false
        type: string
        default:  # empty = master
      timeout:
        description: Timeout for running the proofs
        required: false
        type: string
        default: 7200 # 2h
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  compile:
    name: "Compile to SMIR JSON"
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.vars.outputs.artifact_name }}
      start_prefix: ${{ steps.vars.outputs.start_prefix }}
      show_prefix: ${{ steps.vars.outputs.show_prefix }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - name: "Provide nightly Rust" # https://github.com/rust-lang/rustup/issues/3409
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-11-29 # Hardcoded version for stable-mir-json. TODO can we use nix?

      - name: "Provide Nix"
        uses: cachix/install-nix-action@v30

      - name: "Set up nix shell"
        uses: rrbutani/use-nix-shell-action@v1
        with:
          flakes: github:runtimeverification/stable-mir-json/${{ inputs.smir }}

      - name: "Derive settings from target"
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            p-token)
              echo "crate_dir=p-token" >> "$GITHUB_OUTPUT"
              echo "artifact_name=p-token.smir" >> "$GITHUB_OUTPUT"
              echo "start_prefix=pinocchio_token_program::entrypoint::" >> "$GITHUB_OUTPUT"
              echo "show_prefix=p-token.smir.pinocchio_token_program::entrypoint::" >> "$GITHUB_OUTPUT"
              ;;
            program)
              echo "crate_dir=program" >> "$GITHUB_OUTPUT"
              echo "artifact_name=spl-token.smir" >> "$GITHUB_OUTPUT"
              echo "start_prefix=spl_token::entrypoint::" >> "$GITHUB_OUTPUT"
              echo "show_prefix=spl-token.smir.spl_token::entrypoint::" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported target: '${{ inputs.target }}'" >&2
              exit 1
              ;;
          esac

      - name: "Build with stable_mir_json"      
        run: |
          cd "${{ steps.vars.outputs.crate_dir }}"
          RUSTC=stable_mir_json cargo build --features runtime-verification

      - name: "Store SMIR JSON files"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ./target/debug/deps/*.smir.json
          if-no-files-found: error
          retention-days: 1 # only important during workflow run

  prepare_matrix:
    name: "Prepare proof matrix"
    runs-on: ubuntu-latest
    outputs:
      proofs: ${{ steps.split.outputs.matrix }}
      kmir: ${{ steps.kmir.outputs.kmir }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - name: "Create Proof Array"
        id: split
        run: |
          echo "proofs = '${{ inputs.proofs }}'"
          echo "matrix=${{ inputs.proofs }}" >> $GITHUB_OUTPUT
      - name: "Set KMIR version"
        id: kmir
        run: |
          if [ ! -z "${{ inputs.kmir }}" ]; then
              echo "KMIR version set to ${{ inputs.kmir }}"
              kmir=${{ inputs.kmir }}
          else
              kmir=p-token-$(git rev-parse --short $(git ls-tree HEAD p-token/test-properties/mir-semantics/ | awk '{print $3}'))
          fi
          echo "kmir=$kmir" >> $GITHUB_OUTPUT

  run_proof:
    name: "Link SMIR and Run Proofs"
    needs:
      - compile
      - prepare_matrix
    runs-on: [self-hosted, linux, normal]
    # container:
    #   image: runtimeverificationinc/kmir:${{ needs.prepare_matrix.outputs.kmir }}
    strategy:
      matrix:
        proof: ${{ fromJSON(needs.prepare_matrix.outputs.proofs) }}
    env:
      KMIR_CONTAINER_NAME: "kmir-${{ github.sha }}"
    steps:
      - name: debug matrix and docker image
        run: |
          echo "This is proof ${{ matrix.proof }}"
          echo "Running with $KMIR_CONTAINER_NAME, docker image runtimeverificationinc/kmir:${{ needs.prepare_matrix.outputs.kmir }}"

      - name: "Set up Docker Host"
        run: |
          mkdir -p $PWD/artefacts
          ls -l $PWD/artefacts && rm -rf $PWD/artefacts/*
          chmod a+rwx $PWD/artefacts $PWD
          docker run --rm --detach \
            -u $(id -u):$(id -g) \
            -v $PWD:/workdir --workdir /workdir \
            --name "${KMIR_CONTAINER_NAME}" \
            runtimeverificationinc/kmir:${{ needs.prepare_matrix.outputs.kmir }} \
            bash -c 'while true; do sleep 600; done'
          sleep 10

      - name: "Get SMIR Files"
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.compile.outputs.artifact_name }}
          path: artefacts/

      - name: "Link SMIR Files"
        run: |
          docker exec --workdir /workdir/artefacts/ "${KMIR_CONTAINER_NAME}" \
            bash -c "kmir link -o '${{ needs.compile.outputs.artifact_name }}.json' *.smir.json"

      - name: "Run Proof ${{ matrix.proof }} and store resulting tree"
        run: |
          docker exec --workdir /workdir "${KMIR_CONTAINER_NAME}" \
            bash -c "ls -la artefacts; mkdir -p artefacts/proof; ls -la artefacts"

          timeout ${{ inputs.timeout }} \
            docker exec \
              --workdir /workdir "${KMIR_CONTAINER_NAME}" \
              kmir prove-rs --smir "artefacts/${{ needs.compile.outputs.artifact_name }}.json" \
              --start-symbol "${{ needs.compile.outputs.start_prefix }}${{ matrix.proof }}" \
              --verbose \
              --max-depth 500 \
              --max-iterations 100 \
              --proof-dir artefacts/proof \
            || echo "Runner signals proof failure"

          docker exec --workdir /workdir "${KMIR_CONTAINER_NAME}" \
            kmir show --full-printer --proof-dir artefacts/proof \
            "${{ needs.compile.outputs.show_prefix }}${{ matrix.proof }}" \
            > artefacts/proof/${{ matrix.proof }}-full.txt

      - name: "Save proof tree and smir"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artefacts-${{ matrix.proof }}
          path: |
            artefacts/${{ needs.compile.outputs.artifact_name }}.json
            artefacts/proof/*-full.txt

      - name: "Shut down docker image"
        if: always()
        run: |
          docker stop ${KMIR_CONTAINER_NAME}
          sleep 5
          docker rm -f ${KMIR_CONTAINER_NAME}

      - name: "Clean up artefacts directory"
        if: always()
        run: |
          rm -rf $PWD/artefacts
