name: 'Stable MIR UI Tests'
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Passed as -k to pytest (empty = all tests)'
        type: string
        default: ''
      update-skip:
        description: 'Enable --update-skip mode to shrink skip.txt'
        type: boolean
        default: false
      timeout:
        description: 'Per-test timeout in seconds'
        type: string
        default: '300'

# Runs of the same commit share a container name, so they must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# No job here writes to the repository, so the token stays read-only regardless of
# the repository default.
permissions:
  contents: read

jobs:
  stable-mir-ui-tests:
    name: 'Stable MIR UI Tests'
    runs-on: [self-hosted, linux, normal]
    env:
      CONTAINER_NAME: mir-semantics-${{ github.job }}-${{ github.sha }}
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: 'Check out Rust repo'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rust-lang/rust
          path: rust
          fetch-depth: 1
          persist-credentials: false

      - name: 'Set up Docker'
        uses: ./.github/actions/with-docker
        with:
          container-name: ${{ env.CONTAINER_NAME }}

      - name: 'Align Rust checkout with active toolchain'
        run: |
          docker exec --user github-user "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /home/github-user/workspace
            rust_commit="$(rustc -vV | sed -n "s/^commit-hash: //p")"
            test -n "$rust_commit"
            git -C rust fetch origin "$rust_commit" --depth 1
            git -C rust checkout "$rust_commit"
          '

      - name: 'Build stable-mir-json'
        run: docker exec --user github-user "${CONTAINER_NAME}" make stable-mir-json

      - name: 'Build kmir'
        run: docker exec --user github-user "${CONTAINER_NAME}" make build

      - name: 'Run stable-mir-ui tests'
        env:
          INPUT_FILTER: ${{ inputs.test-filter }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_UPDATE_SKIP: ${{ inputs.update-skip }}
        run: |
          test_args=(--timeout="${INPUT_TIMEOUT}")
          if [ -n "${INPUT_FILTER}" ]; then
            test_args+=(-k "${INPUT_FILTER}")
          fi
          if [ "${INPUT_UPDATE_SKIP}" = "true" ]; then
            test_args+=(--update-skip)
          fi
          printf -v test_args_escaped '%q ' "${test_args[@]}"
          docker exec --user github-user \
            --env RUST_DIR_ROOT=rust \
            "${CONTAINER_NAME}" \
            make test-stable-mir-ui "TEST_ARGS=${test_args_escaped}"

      - name: 'Copy proof artifacts from container'
        if: failure()
        run: |
          rm -rf .github-artifacts/proof-artifacts
          mkdir -p .github-artifacts/proof-artifacts
          docker exec --user github-user "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            artifact_dir=/home/github-user/workspace/.github-artifacts/proof-artifacts
            rm -rf "$artifact_dir"
            mkdir -p "$artifact_dir"
            find /tmp -type f \( -name show.txt -o -path "*/smir.json" \) -print0 | while IFS= read -r -d "" path; do
              case_dir="$(dirname "$path")"
              if [ "$(basename "$path")" = "smir.json" ]; then
                case_dir="$(dirname "$case_dir")"
              fi
              rel="${case_dir#/tmp/}"
              dest="$artifact_dir/$rel"
              rm -rf "$dest"
              mkdir -p "$(dirname "$dest")"
              cp -R "$case_dir" "$dest"
            done
          '
          docker cp "${CONTAINER_NAME}:/home/github-user/workspace/.github-artifacts/proof-artifacts/." .github-artifacts/proof-artifacts/ || true

      - name: 'Upload proof artifacts on failure'
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: proof-artifacts
          path: .github-artifacts/proof-artifacts
          if-no-files-found: ignore

      - name: 'Copy updated skip.txt from container'
        if: ${{ always() && inputs.update-skip }}
        run: |
          rm -rf .github-artifacts/update-skip
          mkdir -p .github-artifacts/update-skip
          docker cp \
            "${CONTAINER_NAME}:/home/github-user/workspace/kmir/src/tests/external/data/stable-mir-ui/skip.txt" \
            .github-artifacts/update-skip/skip.txt || true

      - name: 'Upload updated skip.txt'
        if: inputs.update-skip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: updated-skip-txt
          path: .github-artifacts/update-skip/skip.txt
          if-no-files-found: ignore

      - name: 'Tear down Docker'
        if: always()
        run: |
          # Best effort: the container does not exist if 'Set up Docker' failed, and a
          # non-zero exit here would mask the step that actually failed.
          docker rm -f "${CONTAINER_NAME}" || true
